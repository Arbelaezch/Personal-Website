# Baseline response headers for every site. Include in each server block AND in any location
# that has its own add_header (nginx drops inherited add_header directives in that case).
# Apps keep control of framing, referrer policy and CSP themselves.
add_header Strict-Transport-Security "max-age=15552000" always;   # 180 days, no includeSubDomains/preload yet
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
