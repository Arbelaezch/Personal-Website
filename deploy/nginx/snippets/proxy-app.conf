# Common settings for proxying to an app (gunicorn socket, a container on 127.0.0.1, ...).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# OVERWRITE, never append: the client must not be able to forge X-Forwarded-For
# (apps that trust one proxy hop, such as callback with NUM_PROXIES=1, depend on this).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Security headers are set by nginx (snippets/security-headers.conf); drop the app's copy of
# the one we set so it is not sent twice.
proxy_hide_header X-Content-Type-Options;
