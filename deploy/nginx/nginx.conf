# /etc/nginx/nginx.conf  (managed from deploy/nginx in the Personal-Website repo)
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	# TLS 1.0/1.1 are retired; per-site cipher settings come from certbot's options file
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	access_log /var/log/nginx/access.log;

	# http-level settings (gzip, rate-limit zones, server_tokens) live in conf.d
	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}
