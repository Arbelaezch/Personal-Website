# http-level settings shared by every site on this server.

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

# Rate limiting. Zones are keyed on the client address; apply them per site/location with
# limit_req (see sites-available/christiandonovan.ca and templates/app-site.conf.template).
limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;   # general browsing
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;   # login / auth endpoints
limit_req_status 429;
