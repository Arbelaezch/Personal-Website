{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'blog/css/blog.css' %}">
{% endblock css %}

{% block content %}
<div class="articles">
{% for article in articles %}
<div class="article">
    <div class="article_info">
        {{ article.get_formatted_date }} / {{ article.subject }}
    </div>
    <div class="article-title">
        <a href="{% url 'ArticleView' article.id %}">{{ article.title }}</a>
    </div>
    <div class="article-subtitle">
        {{ article.subtitle|safe }}
    </div>
</div>
{% endfor %}
</div>
{% endblock content %}
