{% extends "admin/change_list.html" %}

{% block object-tools-items %}
<li>
    <form method="post" action="{% url 'admin:portfolio_project_sync_github' %}">
        {% csrf_token %}
        <button type="submit" class="sync-github" title="{% if last_github_sync %}Last successful sync: {{ last_github_sync|date:'Y/m/d H:i' }}{% else %}Never synced{% endif %}">Sync from GitHub now</button>
    </form>
</li>
{{ block.super }}
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* Match the admin's own "Add" button, which is a link. */
    .object-tools form { display: inline; }
    .object-tools .sync-github {
        padding: 3px 12px; border: 0; border-radius: 15px; cursor: pointer;
        background: var(--object-tools-bg); color: var(--object-tools-fg);
        font: inherit; font-size: 0.6875rem; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .object-tools .sync-github:hover { background: var(--object-tools-hover-bg); }
</style>
{% endblock %}
